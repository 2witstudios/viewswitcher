<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Riverside Live · Schedule</title>
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/base.css">
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/theme.css">
</head>
<body>
<main class="scene">
  <div class="slot" data-slot="Screen" style="left: 0; top: 0; width: 1920px; height: 1080px"></div>
  <div class="shade"></div>
  <div class="bug" style="left: 60px; top: 52px"><i></i>RIVERSIDE LIVE</div>
  <div class="clock" style="right: 60px; top: 50px"><span data-clock>8:42 PM</span></div>
  <div class="abs" style="left: 110px; top: 190px; width: 1000px; background: var(--white); color: var(--black)">
    <p style="padding: 20px 36px; background: var(--red); color: var(--white); font-weight: 800; font-size: 40px; letter-spacing: 0.06em">UP NEXT ON THE MAIN STAGE</p>
    <div style="display: grid; grid-template-columns: 300px 1fr; white-space: nowrap; row-gap: 0; font-size: 46px">
      <b style="padding: 22px 36px; font-weight: 800; color: var(--red); border-bottom: 2px solid #e3e5ea">9:15 PM</b><span style="padding: 22px 0; font-weight: 700; border-bottom: 2px solid #e3e5ea">The Lanterns</span>
      <b style="padding: 22px 36px; font-weight: 800; color: var(--red); border-bottom: 2px solid #e3e5ea">10:00 PM</b><span style="padding: 22px 0; font-weight: 700; border-bottom: 2px solid #e3e5ea">Maya &amp; the Tide</span>
      <b style="padding: 22px 36px; font-weight: 800; color: var(--red)">11:00 PM</b><span style="padding: 22px 0; font-weight: 700">Northbound</span>
    </div>
  </div>
  <div class="lower" style="left: 70px; right: 70px; bottom: 70px">
    <div class="row"><span class="flag">LIVE</span><span class="where">RIVERSIDE MUSIC FESTIVAL · DAY 2</span></div>
    <span class="strip">Back with Kofi Osei at the main stage after the break</span>
  </div>
</main>
<script src="/library/{{ORG_ID}}/templates/_shared/view.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Full Count · Pregame</title>
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/base.css">
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/theme.css">
</head>
<body>
<main class="scene">
  <div class="slot" data-slot="Screen" style="left: 0; top: 0; width: 1920px; height: 1080px"></div>
  <div class="shade"></div>
  <p class="abs steel" style="left: 0; right: 0; top: 150px; text-align: center; font-size: 40px; letter-spacing: 0.42em">Tonight on</p>
  <p class="abs" style="left: 50%; top: 220px; transform: translateX(-50%); padding: 6px 64px 16px; background: var(--red); font-weight: 700; font-size: 230px; line-height: 1; white-space: nowrap">Full Count</p>
  <p class="abs" style="left: 0; right: 0; top: 530px; text-align: center; font-weight: 600; font-size: 62px; letter-spacing: 0.04em">Ep. 112 · Trade deadline: winners and losers</p>
  <div class="abs" style="left: 0; right: 0; top: 700px; display: flex; justify-content: center">
    <span style="display: flex; align-items: center; padding: 0 40px; background: var(--navy); border: 5px solid var(--white); font-weight: 600; font-size: 46px; letter-spacing: 0.16em">First pitch in</span>
    <span data-countdown="5" style="padding: 4px 44px; background: var(--red); font-weight: 700; font-size: 120px; line-height: 1.1">5:00</span>
  </div>
  <p class="abs steel" style="left: 0; right: 0; top: 920px; text-align: center; font-size: 30px; letter-spacing: 0.3em">Live tonight · Jay Morales &amp; Dev Okafor</p>
</main>
<script src="/library/{{ORG_ID}}/templates/_shared/view.js"></script>
</body>
</html>

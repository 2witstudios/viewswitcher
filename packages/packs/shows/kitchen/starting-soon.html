<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Saltwater Kitchen · Starting soon</title>
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/base.css">
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/theme.css">
</head>
<body>
<main class="scene">
  <div class="ground paper"></div>
  <p class="abs red" style="left: 150px; top: 130px; font-size: 26px; font-weight: 600; letter-spacing: 0.18em">SALTWATER KITCHEN · EP. 31</p>
  <h1 class="abs hand" style="left: 130px; top: 190px; width: 1100px; font-size: 190px; line-height: 0.92; transform: rotate(-2deg)">The kitchen opens soon.</h1>
  <p class="abs serif" style="left: 150px; top: 640px; width: 1000px; font-style: italic; font-weight: 600; font-size: 58px; line-height: 1.15">Today: Sunday bread, start to finish</p>
  <div class="abs" style="left: 150px; top: 790px; width: 900px; height: 3px; background: var(--ink); opacity: 0.25"></div>
  <p class="abs" style="left: 150px; top: 830px; font-size: 28px; color: var(--ink-2)">Grab a coffee. Flour on the counter if you're baking along.</p>
  <div class="abs" style="left: 1330px; top: 130px; width: 420px; height: 420px; box-sizing: border-box; border-radius: 50%; background: var(--paper); border: 16px solid var(--red); box-shadow: 0 18px 40px -18px rgba(60, 40, 20, 0.5); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px">
    <span class="serif" style="font-weight: 800; font-size: 136px; line-height: 1" data-countdown="5">5:00</span>
    <span class="hand red" style="font-size: 44px">till we start</span>
  </div>
  <div class="slot" data-slot="Screen" style="left: 1328px; top: 640px; width: 444px; height: 270px"></div>
  <div class="frame polaroid" style="left: 1310px; top: 622px; width: 480px; height: 384px"></div>
  <p class="caption" style="left: 1328px; top: 910px; width: 444px">proofing since 7 a.m.</p>
  <div class="tape" style="left: 1480px; top: 602px; transform: rotate(4deg)"></div>
</main>
<script src="/library/{{ORG_ID}}/templates/_shared/view.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViewSwitcher demo</title>
<!-- MAC-18: the demo, for when no Mac is connected. A made-up show (Saltwater Kitchen, from the site;
     show.js is generated by scripts/demo-assets.ts): tap a view and the program cuts to it, the camera,
     guest and screen move into its boxes, and the red On air tally moves with it. Everything is bundled,
     so it works offline. It keeps looking for a Mac and leaves for the real switcher when one answers. -->
<style>
  :root { --bg: #0b0c0f; --side: #101116; --raised: #16181e; --stage: #1c1f27; --line: #1f222a; --line-strong: #343846;
    --sage: #a3a8b5; --quiet: #7d8290; --cream: #f4f5f7; --live: #ff4d4f;
    --safe-top: env(safe-area-inset-top, 0px); --safe-right: env(safe-area-inset-right, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px); --safe-left: env(safe-area-inset-left, 0px); }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: -apple-system, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
  body { display: flex; flex-direction: column; min-height: 100%; }

  /* The demo bar: always there, so nobody mistakes the demo for a live show. */
  .demo-bar { display: flex; align-items: center; gap: 14px; padding: calc(10px + var(--safe-top)) calc(20px + var(--safe-right)) 10px calc(20px + var(--safe-left));
    background: #f4f5f7; color: #0b0c0f; font-size: 16px; }
  .demo-bar .msg { flex: 1; min-width: 0; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .demo-bar .msg span { color: #4b505c; font-weight: 500; }
  .demo-bar button { height: 40px; padding: 0 16px; border: 0; border-radius: 10px; background: #0b0c0f; color: #f4f5f7; font: 700 15px/1 inherit; font-family: inherit; }

  header { display: flex; align-items: center; gap: 12px; padding: 14px calc(20px + var(--safe-right)) 14px calc(20px + var(--safe-left)); border-bottom: 1px solid var(--line); background: var(--side); }
  .mark { width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-weight: 800; font-size: 15px; color: #2a1d05; flex: none; }
  header b { font-size: 18px; font-weight: 700; white-space: nowrap; }
  header .ep { color: var(--sage); font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  header .obs { margin-left: auto; display: inline-flex; align-items: center; gap: 8px; color: var(--sage); font-size: 14px; white-space: nowrap; }
  header .obs i { width: 8px; height: 8px; border-radius: 50%; background: var(--quiet); }

  main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr); gap: 1px; background: var(--line); min-height: 0; }
  @media (orientation: landscape) and (min-width: 900px) { main { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); } }
  .stage, .deck { background: var(--raised); padding: 18px calc(20px + var(--safe-right)) calc(18px + var(--safe-bottom)) calc(20px + var(--safe-left)); min-width: 0; }
  @media (orientation: landscape) and (min-width: 900px) {
    .stage { padding-right: 18px; }
    .deck { padding-left: 18px; overflow-y: auto; }
  }
  @media (orientation: portrait), (max-width: 899px) { .stage { padding-bottom: 18px; } }
  .label { display: flex; align-items: center; gap: 12px; margin: 0 0 12px; color: var(--sage); font-size: 15px; }
  .tally { display: inline-flex; align-items: center; gap: 8px; color: var(--cream); font-weight: 700; }
  .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--live); box-shadow: 0 0 0 4px #ff4d4f33; flex: none; }
  .now { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* The program: the view's own background, the devices in its boxes, then the view on top. */
  .frame { position: relative; aspect-ratio: 16 / 9; border-radius: 10px; overflow: hidden; container-type: inline-size; box-shadow: 0 0 0 2px var(--live); }
  .frame .box, .thumb .box { position: absolute; overflow: hidden; }
  .frame img, .thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .frame .shot { opacity: 0; transition: opacity 240ms ease; }
  .frame .shot.on { opacity: 1; }
  .mover { transition: left 620ms cubic-bezier(.2,.8,.2,1), top 620ms cubic-bezier(.2,.8,.2,1), width 620ms cubic-bezier(.2,.8,.2,1), height 620ms cubic-bezier(.2,.8,.2,1), border-radius 620ms ease, opacity 220ms ease; }
  .mover.gone { opacity: 0; }
  .hint { margin: 14px 0 0; color: var(--quiet); font-size: 15px; }

  .covers { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px 14px; }
  @media (orientation: landscape) and (min-width: 900px) { .covers { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .cover { display: grid; gap: 8px; padding: 0; margin: 0; border: 0; background: transparent; color: var(--sage); font: 600 15px/1.2 -apple-system, system-ui, sans-serif; text-align: left; transition: transform 120ms ease; }
  .cover:active { transform: scale(0.96); }
  .thumb { position: relative; display: block; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; outline: 3px solid #ffffff14; outline-offset: 2px; container-type: inline-size; transition: outline-color 160ms ease; }
  .badge { position: absolute; left: 6px; top: 6px; display: none; align-items: center; gap: 6px; background: #000000b3; color: #fff; font-size: 12px; font-weight: 700; padding: 4px 8px; border-radius: 999px; }
  .badge .dot { width: 7px; height: 7px; box-shadow: none; }
  .cover[aria-pressed="true"] { color: var(--cream); }
  .cover[aria-pressed="true"] .thumb { outline-color: var(--live); }
  .cover[aria-pressed="true"] .badge { display: inline-flex; }
  .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (prefers-reduced-motion: reduce) { .mover, .frame .shot, .cover { transition: none; } }

  /* iPhone (PHONE-7). Upright: the program, then the views two across. */
  @media (max-width: 600px) {
    .demo-bar { gap: 10px; padding: calc(8px + var(--safe-top)) calc(12px + var(--safe-right)) 8px calc(12px + var(--safe-left)); font-size: 14px; }
    .demo-bar #look { display: none; }
    .demo-bar button { height: 36px; padding: 0 12px; font-size: 14px; }
    header { padding: 10px calc(12px + var(--safe-right)) 10px calc(12px + var(--safe-left)); }
    header .obs { display: none; }
    .stage, .deck { padding: 14px calc(12px + var(--safe-right)) 14px calc(12px + var(--safe-left)); }
    .deck { padding-bottom: calc(14px + var(--safe-bottom)); }
    .hint { display: none; }
    .covers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 12px; }
  }
  /* Sideways, as most people hold it: the program on the left, the views beside it, nothing below the fold. */
  @media (max-height: 500px) and (orientation: landscape) {
    body { height: 100%; }
    .demo-bar { padding: calc(6px + var(--safe-top)) calc(16px + var(--safe-right)) 6px calc(16px + var(--safe-left)); font-size: 14px; }
    .demo-bar #look { display: none; }
    .demo-bar button { height: 34px; padding: 0 12px; font-size: 14px; }
    header { display: none; }
    main { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
    .stage { padding: 10px 12px calc(10px + var(--safe-bottom)) calc(16px + var(--safe-left)); }
    .deck { padding: 10px calc(16px + var(--safe-right)) calc(10px + var(--safe-bottom)) 12px; overflow-y: auto; }
    .label { margin-bottom: 8px; font-size: 14px; }
    .hint { display: none; }
    .covers { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .cover { font-size: 13px; gap: 4px; }
  }
</style>
</head>
<body>
<div class="demo-bar" role="status">
  <span class="msg">Demo · Connect your Mac to go live <span id="look">· looking for your Mac…</span></span>
  <button type="button" id="connect">Connect your Mac</button>
</div>
<header>
  <span class="mark" id="mark" aria-hidden="true"></span>
  <b id="show"></b>
  <span class="ep" id="ep"></span>
  <span class="obs"><i></i>Sample show · nothing is streamed</span>
</header>
<main>
  <section class="stage" aria-label="Program">
    <p class="label"><span class="tally"><span class="dot"></span>On air</span><span class="now" id="now" aria-live="polite"></span></p>
    <div class="frame" id="frame"></div>
    <p class="hint">Tap a view. The program changes, and the camera, guest and screen move to where the view puts them. With your Mac, this is what goes out to OBS.</p>
  </section>
  <section class="deck" aria-label="Views">
    <p class="label">Views</p>
    <div class="covers" id="covers" role="group" aria-label="Views"></div>
  </section>
</main>
<script src="../probe.js"></script>
<script src="show.js"></script>
<script>
  const show = window.DEMO_SHOW;
  const views = show.views;
  const $ = (id) => document.getElementById(id);
  const pct = (v, of) => `${(v / of) * 100}%`;
  const radius = (r) => (r.endsWith("px") ? `calc(${parseFloat(r)} / 1920 * 100cqw)` : r);
  const place = (el, s) => Object.assign(el.style, { left: pct(s.x, 1920), top: pct(s.y, 1080), width: pct(s.w, 1920), height: pct(s.h, 1080), borderRadius: radius(s.radius) });
  const img = (src, cls, focus) => { const i = new Image(); i.src = src; i.alt = ""; i.decoding = "async"; if (cls) i.className = cls; if (focus) i.style.objectPosition = focus; return i; };

  $("show").textContent = show.name;
  $("ep").textContent = show.episode;
  $("mark").textContent = show.name[0];
  $("mark").style.background = show.accent;

  // The program frame: one mover per device (it glides between views), and every view's overlay.
  const frame = $("frame");
  const devices = new Map();
  for (const v of views) for (const s of v.slots) if (!devices.has(s.name)) devices.set(s.name, s);
  const movers = [...devices.values()].map((s) => {
    const box = document.createElement("div");
    box.className = "box mover gone";
    box.dataset.device = s.name;
    Object.assign(box.style, { left: "50%", top: "50%", width: "0", height: "0" });
    box.append(img(`media/${s.media}.jpg`, "", s.focus));
    frame.append(box);
    return box;
  });
  const shots = views.map((v) => { const i = img(`views/${v.file}.webp`, "shot"); frame.append(i); return i; });

  // The covers: each a still of its view.
  const covers = views.map((v, i) => {
    const b = document.createElement("button");
    b.type = "button";
    b.className = "cover";
    b.setAttribute("aria-pressed", "false");
    b.setAttribute("aria-label", v.name);
    const thumb = document.createElement("span");
    thumb.className = "thumb";
    thumb.style.background = v.ground;
    for (const s of v.slots) {
      const box = document.createElement("span");
      box.className = "box";
      place(box, s);
      box.append(img(`media/${s.media}.jpg`, "", s.focus));
      thumb.append(box);
    }
    thumb.append(img(`views/${v.file}.webp`));
    const badge = document.createElement("span");
    badge.className = "badge";
    badge.innerHTML = `<span class="dot"></span>On air`;
    thumb.append(badge);
    const name = document.createElement("span");
    name.className = "name";
    name.textContent = v.name;
    b.append(thumb, name);
    b.addEventListener("click", () => take(i));
    $("covers").append(b);
    return b;
  });

  function take(i) {
    const v = views[i];
    frame.style.background = v.ground;
    shots.forEach((s, n) => s.classList.toggle("on", n === i));
    covers.forEach((c, n) => c.setAttribute("aria-pressed", String(n === i)));
    $("now").textContent = v.name;
    for (const m of movers) {
      const s = v.slots.find((x) => x.name === m.dataset.device);
      m.classList.toggle("gone", !s);
      if (s) place(m, s);
    }
  }
  take(Math.max(0, views.findIndex((v) => v.file === show.start)));

  // Back to the connector, and don't come straight back here until the app is launched again.
  $("connect").addEventListener("click", () => { leaving = true; VS.leaveDemo(); location.href = "../"; });

  // Connecting a Mac leaves the demo: keep looking, and open the real switcher when one answers.
  let busy = false, leaving = false;
  async function look() {
    if (busy || leaving) return;
    busy = true;
    try {
      const found = await VS.find();
      if (found && !leaving) { leaving = true; $("look").textContent = `· connected over ${found.how}…`; VS.open(found.base); }
    } finally { busy = false; }
  }
  look();
  setInterval(look, 1500);
</script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViewSwitcher</title>
<!-- Connector: finds the ViewSwitcher server (USB-C first, then the network) and opens the switcher it serves.
     With no Mac it offers the demo (demo/, MAC-18), and opens it by itself until a Mac has been connected once. -->
<style>
  :root { --bg: #0b0c0f; --raised: #16181e; --line: #343846; --muted: #a3a8b5; --quiet: #7d8290; --text: #f4f5f7; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: calc(32px + env(safe-area-inset-top)) calc(32px + env(safe-area-inset-right)) calc(32px + env(safe-area-inset-bottom)) calc(32px + env(safe-area-inset-left)); text-align: center; }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; font-weight: 700; font-size: 34px; letter-spacing: -0.02em; }
  #status { margin: 0; font-size: 18px; color: var(--muted); min-height: 1.4em; }
  .row { display: flex; gap: 10px; width: min(560px, 100%); }
  label { font-size: 13px; color: var(--quiet); width: min(560px, 100%); text-align: left; }
  input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--raised); color: var(--text); font-size: 16px; }
  button { height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--text); color: var(--bg); font-size: 16px; font-weight: 700; }
  .demo { background: transparent; color: var(--text); border: 2px solid var(--line); }
  .demo[hidden] { display: none; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--text); margin-right: 10px; animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: 0.25; } }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>ViewSwitcher</h1>
  <p id="status"><span class="dot"></span>Looking for the ViewSwitcher server…</p>
  <label for="net">Without the cable: on the Mac, turn on Phones and Tablets in ViewSwitcher's menu, then enter the address it shows, e.g. http://your-mac.local:7420</label>
  <form class="row" id="form">
    <input id="net" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="http://your-mac.local:7420">
    <button type="submit">Save</button>
  </form>
  <button type="button" class="demo" id="demo" hidden>Try the demo</button>
</main>
<script src="probe.js"></script>
<script>
  const status = document.getElementById("status");
  const net = document.getElementById("net");
  const demo = document.getElementById("demo");
  // The address saved by the Capacitor build, handed over once by the app (#network=…).
  const handed = new URLSearchParams(location.hash.slice(1)).get("network");
  if (handed !== null) {
    if (!VS.network() && handed) VS.saveNetwork(handed);
    history.replaceState(null, "", location.pathname);
  }
  net.value = VS.network();
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = net.value.trim().replace(/\/+$/, "");
    if (v && !VS.usable(v)) {
      status.textContent = "Use the .local address ViewSwitcher shows on the Mac, under Phones and Tablets.";
      return;
    }
    VS.saveNetwork(v);
    net.blur();
    check();
  });
  demo.addEventListener("click", () => { leaving = true; location.href = "demo/"; });

  let busy = false, leaving = false;
  const started = Date.now();
  async function check() {
    if (busy || leaving) return;
    busy = true;
    try {
      const found = await VS.find();
      if (leaving) return;
      if (found) {
        status.textContent = `Connected over ${found.how}…`;
        leaving = true;
        VS.open(found.base);
        return;
      }
      // No Mac. Until one has been connected, the app opens on the demo (App Review and new buyers
      // try it there); after leaving it, or once a Mac has been used, the connector stays and offers it.
      // A saved network address means it was used before (an earlier build). It waits ~4.5 s first: at
      // launch the Mac's usb-bridge dials the tunnel on a 1 s retry and UsbTunnel holds a request up to 4 s.
      if (!VS.connectedBefore() && !VS.network() && !VS.leftDemo()) {
        if (Date.now() - started < 4500) return;
        leaving = true;
        location.replace("demo/");
        return;
      }
      status.innerHTML = `<span class="dot"></span>Plug in the USB-C cable and open ViewSwitcher on the Mac.`;
      demo.hidden = false;
    } finally { busy = false; }
  }
  check();
  setInterval(check, 1000);
</script>
</body>
</html>

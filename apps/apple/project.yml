# ViewSwitcher for Apple platforms (MAC-10): one project, generated with XcodeGen.
#   cd apps/apple && xcodegen      (the .xcodeproj is gitignored; scripts/*.sh run this for you)
# Targets: ViewSwitcher (macOS 14+, the Mac app around the bundled server), ViewSwitcher iPad
# (iPadOS and iOS 17+, one universal app for iPad and iPhone (PHONE-1): the switcher over USB-C or the network) and the shared ViewSwitcherKit package (Kit/).
name: ViewSwitcher
options:
  bundleIdPrefix: com.twowitstudios
  deploymentTarget:
    macOS: "14.0"
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    DEVELOPMENT_TEAM: M96WTV3CKX
    MARKETING_VERSION: "1.2.0"
    # Sparkle compares CFBundleVersion, so it follows the version (bump MARKETING_VERSION for a release).
    CURRENT_PROJECT_VERSION: $(MARKETING_VERSION)
    SWIFT_VERSION: "5.10"
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    DEAD_CODE_STRIPPING: YES
packages:
  ViewSwitcherKit:
    path: Kit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6
targets:
  ViewSwitcher:
    type: application
    platform: macOS
    sources:
      - path: Mac
        excludes: ["*.entitlements", "Info.plist"]
    dependencies:
      - package: ViewSwitcherKit
      - package: Sparkle
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: ViewSwitcher
        CFBundleName: ViewSwitcher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.video
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: Copyright © 2026 2wit Studios
        NSPrincipalClass: NSApplication
        # The switcher is plain http on 127.0.0.1.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # Phones and tablets on the Wi-Fi (MAC-23): announce the switcher over Bonjour while that's on.
        NSLocalNetworkUsageDescription: ViewSwitcher lets the phones and tablets you pair switch scenes over this Wi-Fi, when you turn that on.
        NSBonjourServices:
          - _http._tcp
        # Sparkle (MAC-15): the appcast on the latest published GitHub release (ViewSwitcherKit.UpdateFeed).
        SUFeedURL: https://github.com/2witstudios/viewswitcher/releases/latest/download/appcast.xml
        SUPublicEDKey: $(SPARKLE_PUBLIC_KEY)
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 21600
        SUVerifyUpdateBeforeExtraction: true
        # Only the OS's own TLS (https to a Tailscale address): exempt (MAC-20).
        ITSAppUsesNonExemptEncryption: false
    entitlements:
      path: Mac/ViewSwitcher.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twowitstudios.viewswitcher.mac
        PRODUCT_NAME: ViewSwitcher
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
        # Sparkle EdDSA public key; the private half is in the login keychain (account "viewswitcher"; see README.md).
        SPARKLE_PUBLIC_KEY: hI8q9sOz72oOMceNPz4m2eELKkEFd2kGt+QkezqFw7Y=
        COMBINE_HIDPI_IMAGES: YES
      configs:
        Release:
          ARCHS: "arm64 x86_64"
          ONLY_ACTIVE_ARCH: NO
          CODE_SIGN_IDENTITY: "Developer ID Application"
          OTHER_CODE_SIGN_FLAGS: --timestamp
    postBuildScripts:
      # The server and what it serves (scripts/build.sh puts them in build/payload; see README.md):
      # Contents/Helpers/viewswitcher-server (signed by build.sh with its own entitlements) and
      # Contents/Resources/{web,starter,library-kit,packs}. Release only: a Debug build runs the server
      # from the checkout instead (VIEWSWITCHER_REPO, set by scripts/dev.sh).
      - name: Embed server payload
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          payload="$SRCROOT/build/payload"
          contents="$TARGET_BUILD_DIR/$CONTENTS_FOLDER_PATH"
          if [ "$CONFIGURATION" != "Release" ]; then
            echo "note: Debug builds run the server from the checkout (VIEWSWITCHER_REPO, set by scripts/dev.sh)"; exit 0
          fi
          if [ ! -x "$payload/viewswitcher-server" ]; then
            echo "error: no server payload in $payload; build with scripts/build.sh (bun run mac:build)"; exit 1
          fi
          mkdir -p "$contents/Helpers" "$contents/Resources"
          ditto "$payload/viewswitcher-server" "$contents/Helpers/viewswitcher-server"
          for d in web starter library-kit packs; do rm -rf "$contents/Resources/$d"; ditto "$payload/$d" "$contents/Resources/$d"; done
  ViewSwitcher iPad:
    type: application
    platform: iOS
    sources:
      - path: iPad
        excludes: ["Info.plist", "Connector"]
      - path: iPad/Connector
        type: folder
        buildPhase: resources
    dependencies:
      - package: ViewSwitcherKit
    info:
      path: iPad/Info.plist
      properties:
        CFBundleDisplayName: ViewSwitcher
        CFBundleName: ViewSwitcher
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSRequiresIPhoneOS: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
          UISceneConfigurations:
            UIWindowSceneSessionRoleApplication:
              - UISceneConfigurationName: Default Configuration
                UISceneDelegateClassName: $(PRODUCT_MODULE_NAME).SceneDelegate
        # Split View, Slide Over and Stage Manager (MAC-13a) need every orientation and no full-screen lock.
        # App Store validation reads both keys for an iPad-only app (MAC-20), so both list all four.
        UIRequiresFullScreen: false
        UISupportedInterfaceOrientations: &orientations
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad: *orientations
        UIStatusBarHidden: true
        UIViewControllerBasedStatusBarAppearance: true
        # The switcher is plain http from 127.0.0.1 (the USB-C tunnel) or the LAN.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # The only permission the app asks for (MAC-20): camera, microphone, motion and location are refused
        # in the web view without asking, so they have no usage strings.
        NSLocalNetworkUsageDescription: ViewSwitcher connects to the ViewSwitcher server on your Mac when the USB-C cable isn't plugged in.
        # Only the OS's own TLS (https to a Tailscale address): exempt, no export compliance documents (MAC-20).
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.twowitstudios.viewswitcher
        PRODUCT_NAME: ViewSwitcher
        # iPhone and iPad (PHONE-1): one universal app, one bundle id, one purchase.
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
  ViewSwitcher iPad UITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [iPadUITests]
    dependencies:
      - target: ViewSwitcher iPad
    settings:
      base:
        # iPhone and iPad (PHONE-1): one universal app, one bundle id, one purchase.
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_STYLE: Automatic
schemes:
  ViewSwitcher:
    build:
      targets:
        ViewSwitcher: all
    test:
      targets:
        - package: ViewSwitcherKit/ViewSwitcherKitTests
    run:
      config: Debug
    archive:
      config: Release
  ViewSwitcher iPad:
    build:
      targets:
        ViewSwitcher iPad: all
    test:
      targets:
        - ViewSwitcher iPad UITests
    run:
      config: Debug
    archive:
      config: Release

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Teaching</title>
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/theme.css">
</head>
<body>
<main class="scene">
  <div class="slot" data-slot="Screen" style="left: 32px; top: 32px; width: 1472px; height: 828px"></div>
  <div class="slot" data-slot="Camera" style="left: 1528px; top: 32px; width: 360px; height: 450px"></div>

  <section class="abs panel" style="left: 1528px; top: 506px; width: 360px; height: 354px; box-sizing: border-box; padding: 26px 28px; display: flex; flex-direction: column; gap: 14px">
    <span class="kicker" style="font-size: 14px">Notes</span>
    <p style="margin: 0; font-size: 24px; line-height: 1.35">Key point, link or question for chat.</p>
  </section>

  <footer class="abs panel" style="left: 32px; top: 884px; width: 1856px; height: 164px; box-sizing: border-box; padding: 0 44px; display: flex; align-items: center; gap: 36px">
    <img src="/library/{{ORG_ID}}/templates/_shared/brand/mark.svg" alt="" width="72" height="72">
    <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 10px">
      <span class="kicker" style="font-size: 17px">{{ORG_NAME}}</span>
      <h2 class="display" style="font-size: 58px; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">Today's topic</h2>
    </div>
    <span class="chip"><span class="dot" style="width: 10px; height: 10px; background: var(--on-accent)"></span>LIVE</span>
  </footer>
</main>
<script src="/library/{{ORG_ID}}/templates/_shared/scene.js"></script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Starting soon</title>
<link rel="stylesheet" href="/library/{{ORG_ID}}/templates/_shared/theme.css">
</head>
<body>
<main class="scene">
  <div class="abs" style="left: 112px; top: 96px; display: flex; align-items: center; gap: 18px">
    <img src="/library/{{ORG_ID}}/templates/_shared/brand/mark.svg" alt="" width="64" height="64">
    <span class="display" style="font-size: 40px; letter-spacing: -0.01em">{{ORG_NAME}}</span>
  </div>

  <div class="abs" style="left: 112px; top: 320px; width: 1200px; display: flex; flex-direction: column; gap: 32px">
    <div class="kicker" style="display: flex; align-items: center; gap: 14px; font-size: 20px"><span class="dot"></span>Live</div>
    <h1 class="display" style="font-size: 180px">Starting soon.</h1>
    <p class="muted" style="margin: 0; font-size: 38px; line-height: 1.3">Today's topic goes here</p>
  </div>

  <div class="abs" style="left: 112px; bottom: 112px; display: flex; flex-direction: column; gap: 10px">
    <span class="kicker" style="font-size: 16px">We start in</span>
    <span data-countdown="5" style="font-family: var(--display); font-size: 96px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums">5:00</span>
  </div>
</main>
<script src="/library/{{ORG_ID}}/templates/_shared/scene.js"></script>
</body>
</html>

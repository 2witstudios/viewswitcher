<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ViewSwitcher</title>
<!-- Connector: finds the Daisy server (USB-C first, then the network) and opens the switcher it serves. -->
<style>
  :root { --bg: #0a120d; --stage: #173b2a; --line: #2f5a42; --sage: #a7c09c; --sage-deep: #7e9c79; --cream: #f5f0e4; --yolk: #f2c14e; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--cream); font-family: -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  main { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 22px; padding: 32px; text-align: center; }
  img { width: 96px; height: 96px; }
  h1 { margin: 0; font-family: Georgia, serif; font-weight: 900; font-size: 34px; }
  #status { margin: 0; font-size: 18px; color: var(--sage); min-height: 1.4em; }
  .row { display: flex; gap: 10px; width: min(560px, 100%); }
  label { font-size: 13px; color: var(--sage-deep); width: min(560px, 100%); text-align: left; }
  input { flex: 1; min-width: 0; height: 48px; padding: 0 14px; border: 2px solid var(--line); border-radius: 12px; background: #0d1812; color: var(--cream); font-size: 16px; }
  button { height: 48px; padding: 0 20px; border: 0; border-radius: 12px; background: var(--yolk); color: var(--stage); font-size: 16px; font-weight: 700; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--yolk); margin-right: 10px; animation: pulse 1.2s infinite ease-in-out; }
  @keyframes pulse { 50% { opacity: 0.25; } }
</style>
</head>
<body>
<main>
  <img src="icon.svg" alt="">
  <h1>ViewSwitcher</h1>
  <p id="status"><span class="dot"></span>Looking for the Daisy server…</p>
  <label for="net">Network address (used when the cable isn't plugged in), e.g. https://your-mac.tailnet.ts.net</label>
  <form class="row" id="form">
    <input id="net" type="url" inputmode="url" autocapitalize="off" autocorrect="off" spellcheck="false" placeholder="https://your-mac.tailnet.ts.net">
    <button type="submit">Save</button>
  </form>
</main>
<script>
  const USB = "http://127.0.0.1:7420"; // the app's USB-C tunnel to the Mac
  const KEY = "viewswitcher.network";
  const status = document.getElementById("status");
  const net = document.getElementById("net");
  const read = () => { try { return localStorage.getItem(KEY) || ""; } catch { return ""; } };
  net.value = read();
  document.getElementById("form").addEventListener("submit", (e) => {
    e.preventDefault();
    const v = net.value.trim().replace(/\/+$/, "");
    try { localStorage.setItem(KEY, v); } catch {}
    net.blur();
    check();
  });

  // Reachable = the request completed (no-cors: the response is opaque, which is all we need).
  async function reachable(base) {
    const ctl = new AbortController();
    const t = setTimeout(() => ctl.abort(), 1200);
    try {
      await fetch(`${base}/api/state?probe=${Date.now()}`, { mode: "no-cors", cache: "no-store", signal: ctl.signal });
      return true;
    } catch { return false; } finally { clearTimeout(t); }
  }

  let busy = false;
  async function check() {
    if (busy) return;
    busy = true;
    try {
      const network = read();
      for (const [base, how] of [[USB, "USB-C"], ...(network ? [[network, "the network"]] : [])]) {
        if (await reachable(base)) {
          status.textContent = `Connected over ${how}…`;
          location.replace(`${base}/`);
          return;
        }
      }
      status.innerHTML = `<span class="dot"></span>Plug in the USB-C cable and start the Daisy server on the Mac (bun run start).`;
    } finally { busy = false; }
  }
  check();
  setInterval(check, 1000);
</script>
</body>
</html>

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    # The product is Mac-only, and the end-to-end tests bind this machine's LAN address.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config while bun install runs package scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Site check
        run: bun run check
        working-directory: apps/site
      - name: Switcher build (bundled by the Mac app)
        run: bun run build

  swift:
    name: ViewSwitcherKit (swift test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; no step needs the token in .git/config
      # ServerControllerTests start bun stub servers; without bun they skip.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Swift 6 language mode makes a possible data race (a captured var mutated from another
      # thread, say) a build error, where the package's own mode only warns.
      - run: swift build --build-tests -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        working-directory: apps/apple/Kit
      - run: swift test
        working-directory: apps/apple/Kit

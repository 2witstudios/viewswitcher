name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  test:
    name: Test and typecheck
    # The end-to-end tests bind this machine's LAN address. (Windows has its own job below.)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # no token in .git/config while bun install runs package scripts
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck
      - name: Site check
        run: bun run check
        working-directory: apps/site
      - name: Switcher build (bundled by the Mac app)
        run: bun run build

  swift:
    name: ViewSwitcherKit (swift test)
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false # nothing here pushes; no step needs the token in .git/config
      # ServerControllerTests start bun stub servers; without bun they skip.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Swift 6 language mode makes a possible data race (a captured var mutated from another
      # thread, say) a build error, where the package's own mode only warns.
      - run: swift build --build-tests -Xswiftc -swift-version -Xswiftc 6 -Xswiftc -warnings-as-errors
        working-directory: apps/apple/Kit
      - run: swift test
        working-directory: apps/apple/Kit

  windows:
    name: Server and switcher on Windows
    # The server runs on Windows too (apps/windows bundles it): its tests there, where paths, renames
    # and links behave differently. GitHub's runners are admins, so the file-link tests run too.
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - run: bun test
      - run: bun run typecheck

  windows-app:
    name: Windows app (dotnet test, build)
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Core tests start Bun stub servers; without bun they skip.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test apps/windows/ViewSwitcher.Core.Tests
      - run: dotnet build apps/windows/ViewSwitcher.Windows/ViewSwitcher.Windows.csproj -c Release -p:Platform=x64 -warnaserror
